name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: ruff check
        run: python -m ruff check --output-format=github .
      - name: ruff format
        run: python -m ruff format --check --diff .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # Both platforms, because the runner is linux and the shop is not. A
      # branch guarded on sys.platform only type checks on the platform it was
      # written on, and that is the one nobody deploys to.
      - name: mypy on linux
        run: python -m mypy --platform linux
      - name: mypy on windows
        run: python -m mypy --platform win32

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q --cov=qu_imager --cov-report=term-missing --cov-fail-under=95
      - name: upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      # Up, all the way down, and up again. A migration that only runs forwards
      # is a migration nobody can back out of at two in the morning.
      - name: upgrade
        run: python -m alembic upgrade head
      - name: downgrade to base
        run: python -m alembic downgrade base
      - name: upgrade again
        run: python -m alembic upgrade head
      # The schema the migrations build has to be the schema the models
      # describe. Autogenerate finding anything means the two have drifted.
      - name: no drift between the models and the migrations
        run: |
          python - <<'PY'
          from alembic.autogenerate import compare_metadata
          from alembic.migration import MigrationContext

          from qu_imager.persistence.base import Base
          from qu_imager.persistence.models import *  # noqa: F401,F403
          from qu_imager.persistence.unit_of_work import build_engine

          engine = build_engine("sqlite:///qu_imager.sqlite3")
          with engine.connect() as connection:
              context = MigrationContext.configure(connection)
              diff = compare_metadata(context, Base.metadata)
          if diff:
              for entry in diff:
                  print(entry)
              raise SystemExit("the models and the migrations have drifted")
          print("no drift")
          PY

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install build
      - name: build the wheel
        run: python -m build
      - name: install the wheel into a clean environment
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
      - name: the console script runs
        run: /tmp/clean/bin/qu-imager --version
      - name: the type marker ships
        run: /tmp/clean/bin/python -c "import qu_imager, pathlib, sys; p = pathlib.Path(qu_imager.__file__).parent / 'py.typed'; sys.exit(0 if p.exists() else 'py.typed did not make it into the wheel')"
