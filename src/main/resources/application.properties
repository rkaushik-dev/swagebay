# The database is handed to the application when it starts; what is here is only how Spring itself
# should behave.
spring.application.name=swagebay
spring.main.banner-mode=off
server.error.whitelabel.enabled=false
# The API document and its viewer, at the paths clients already use.
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/openapi.json
springdoc.api-docs.version=openapi_3_1
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/docs
